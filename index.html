<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayo Store | E-Commerce Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-bag-shopping"></i> Bayo Store
        </div>
        
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search products...">
            <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div class="cart-icon-btn" id="open-cart-btn">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cart-count">0</span>
        </div>
    </header>

    <!-- Category Filter Bar -->
    <section class="filters-container">
        <button class="filter-btn active" data-category="all">All Products</button>
        <button class="filter-btn" data-category="men's clothing">Men's Fashion</button>
        <button class="filter-btn" data-category="women's clothing">Women's Fashion</button>
        <button class="filter-btn" data-category="jewelery">Jewelry</button>
        <button class="filter-btn" data-category="electronics">Electronics</button>
    </section>

    <!-- Main Content Area -->
    <main class="container">
        <h2 class="section-title">Explore Products</h2>
        <div id="product-grid" class="product-grid">
            <!-- Product cards will be dynamically injected here via JavaScript -->
        </div>
    </main>

    <!-- Slide-Out Shopping Cart Drawer -->
    <div id="cart-drawer" class="cart-drawer">
        <div class="cart-header">
            <h3>Your Shopping Cart</h3>
            <button id="close-cart-btn" class="close-btn">&times;</button>
        </div>

        <div id="cart-items" class="cart-items">
            <!-- Cart items will be dynamically injected here -->
        </div>

        <div class="cart-footer">
            <div class="cart-total">
                <span>Total Amount:</span>
                <span id="cart-total-price">$0.00</span>
            </div>
            <button id="checkout-btn" class="btn checkout-btn">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Overlay backdrop for cart -->
    <div id="cart-overlay" class="cart-overlay"></div>

    <!-- JavaScript Files -->
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
